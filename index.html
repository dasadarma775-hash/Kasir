<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasir">
<meta name="theme-color" content="#0e6b5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f5f1;--surface:#fff;--ink:#17262b;--mute:#66777c;--line:#dbe3df;--brand:#0e6b5c;--brand-ink:#fff;--gold:#f2b632;--danger:#b3341f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--surface:#18232a;--ink:#e8f0ee;--mute:#8da0a3;--line:#2a3a40;--brand:#2fb59d;--brand-ink:#05231e;--gold:#f2b632;--danger:#ff8a73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716;--surface:#18232a;--ink:#e8f0ee;--mute:#8da0a3;--line:#2a3a40;--brand:#2fb59d;--brand-ink:#05231e;--gold:#f2b632;--danger:#ff8a73;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 14px 170px;font-variant-numeric:tabular-nums}
h1{font-size:1.25rem;font-weight:800;margin:16px 0 12px}
button,input{font:inherit;color:inherit}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px}
input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pri:disabled{opacity:.4;cursor:not-allowed}
.danger{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.tile.on{border-color:var(--brand)}
.tile .add{border:0;border-radius:0;background:none;text-align:left;padding:14px 12px;min-height:76px;width:100%;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile .add b{font-weight:600}
.tile .add span{color:var(--mute);font-size:.9rem}
.tile .st{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--bg);border-top:1.5px solid var(--line)}
.tile .st button{width:44px;height:38px;padding:0;font-size:1.2rem}
.tile .st b{font-weight:800;font-size:1.05rem}
#prt{display:none;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#000}
#prt hr{border:0;border-top:1px dashed #000;margin:6px 0}
#prt .pl,.paper .pl{display:flex;justify-content:space-between;gap:8px}
.paper{background:#fff;color:#000;border-radius:6px;padding:16px 14px;margin:6px 0 14px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.paper hr{border:0;border-top:1px dashed #000;margin:8px 0}
@media print{@page{margin:3mm}body>*:not(#prt){display:none!important}body{padding:0;background:#fff}#prt{display:block}}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .g{flex:1;min-width:0}
.row small,.mute{color:var(--mute)}
.row .btns{display:flex;gap:6px}
.row button{padding:8px 12px}
.empty{padding:32px 8px;text-align:center;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.25rem;font-weight:800}
.fixed{position:fixed;left:0;right:0;z-index:5}
#bar{bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:0 14px 10px}
#bar button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-weight:800;font-size:1.05rem;border-radius:14px}
#bar em{font-style:normal;color:var(--gold)}
#tabs{bottom:0;display:flex;background:var(--surface);border-top:1.5px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;border:0;border-radius:0;background:none;height:60px;color:var(--mute);font-weight:600}
#tabs button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
#ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#ov.show{display:flex}
#sheet{width:100%;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;padding:0;font-size:1.1rem}
.total{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:800;padding:14px 0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.quick button{padding:9px 12px}
.chg{display:flex;justify-content:space-between;padding:6px 0 14px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;display:none;font-size:.9rem}
.det{padding:6px 0 10px;color:var(--mute);font-size:.92rem}
.det div{display:flex;justify-content:space-between}
@media (min-width:600px){body{max-width:640px;margin:0 auto}.grid{grid-template-columns:repeat(3,1fr)}.fixed{left:50%;right:auto;width:640px;transform:translateX(-50%)}}
</style>
</head>
<body>
<div id="view"></div>
<div id="bar" class="fixed"></div>
<nav id="tabs" class="fixed">
<button data-a="tab" data-i="kasir">Kasir</button>
<button data-a="tab" data-i="produk">Produk</button>
<button data-a="tab" data-i="riwayat">Riwayat</button>
</nav>
<div id="ov"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="prt"></div>
<script>
const $=s=>document.querySelector(s);
const K='kasir.v1';
const rp=n=>'Rp\u00a0'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db={products:[],sales:[],seq:10};
let raw=null;try{raw=localStorage.getItem(K)}catch(e){}
if(raw){try{db=JSON.parse(raw)}catch(e){}}
else db.products=[{id:1,name:'Kopi susu',price:15000},{id:2,name:'Teh manis',price:8000},{id:3,name:'Roti bakar',price:12000},{id:4,name:'Mie goreng',price:18000},{id:5,name:'Air mineral',price:4000}];
let tab='kasir',cart={},q='',editId=null,confirmId=null,openSale=null,receipt=null,sheetOn=false,paid=0,tt;
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Data tidak bisa disimpan di peramban ini')}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2200)}
const prod=id=>db.products.find(p=>p.id==id);
const lines=()=>Object.keys(cart).map(id=>({p:prod(id),qty:cart[id]})).filter(l=>l.p);
const total=()=>lines().reduce((s,l)=>s+l.p.price*l.qty,0);
const count=()=>lines().reduce((s,l)=>s+l.qty,0);

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.i===tab));
  const v=$('#view');
  if(tab==='kasir'){
    v.innerHTML='<h1>Kasir</h1><input id="q" type="search" placeholder="Cari produk" value="'+esc(q)+'"><div id="grid" class="grid"></div>';
    grid();
  }else if(tab==='produk'){
    const e=db.products.find(p=>p.id===editId);
    v.innerHTML='<h1>Produk</h1><details style="margin-bottom:14px"'+(db.shop?'':' open')+'><summary style="cursor:pointer;font-weight:600;margin-bottom:10px">Pengaturan struk</summary><input id="shop" placeholder="Nama toko" value="'+esc(db.shop||'')+'"><input id="addr" placeholder="Alamat toko" value="'+esc(db.addr||'')+'"><input id="tel" inputmode="tel" placeholder="Nomor telepon" value="'+esc(db.tel||'')+'"><input id="foot" placeholder="Pesan di akhir struk (contoh: Terima kasih atas kunjungan Anda)" value="'+esc(db.foot||'')+'"></details><input id="pn" placeholder="Nama produk" value="'+(e?esc(e.name):'')+'"><input id="pp" inputmode="numeric" placeholder="Harga (angka)" value="'+(e?e.price:'')+'"><div style="display:flex;gap:8px;margin-bottom:14px"><button class="pri" data-a="saveprod" style="flex:1">'+(e?'Simpan perubahan':'Tambah produk')+'</button>'+(e?'<button data-a="cancel">Batal</button>':'')+'</div>'+
    (db.products.length?db.products.map(p=>'<div class="row"><div class="g"><b>'+esc(p.name)+'</b><br><small>'+rp(p.price)+'</small></div><div class="btns"><button data-a="editprod" data-i="'+p.id+'">Ubah</button><button class="danger" data-a="delprod" data-i="'+p.id+'">'+(confirmId===p.id?'Yakin hapus?':'Hapus')+'</button></div></div>').join(''):'<div class="empty">Belum ada produk. Tambahkan produk pertama di atas.</div>');
  }else{
    const day=new Date().toDateString();
    const today=db.sales.filter(s=>new Date(s.ts).toDateString()===day);
    const sum=a=>a.reduce((x,s)=>x+s.total,0);
    v.innerHTML='<h1>Riwayat</h1><div class="stats"><div class="stat"><span class="mute">Hari ini</span><b>'+rp(sum(today))+'</b><small class="mute">'+today.length+' transaksi</small></div><div class="stat"><span class="mute">Semua</span><b>'+rp(sum(db.sales))+'</b><small class="mute">'+db.sales.length+' transaksi</small></div></div>'+
    (db.sales.length?db.sales.slice(0,100).map(s=>{const d=new Date(s.ts),o=openSale===s.id;return '<div class="row" style="flex-wrap:wrap" data-a="sale" data-i="'+s.id+'"><div class="g"><b>'+rp(s.total)+'</b><br><small>'+d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' · '+s.items.reduce((x,i)=>x+i.qty,0)+' item</small></div>'+(o?'<div class="det" style="width:100%">'+s.items.map(i=>'<div><span>'+i.qty+' × '+esc(i.name)+'</span><span>'+rp(i.qty*i.price)+'</span></div>').join('')+'<div><span>Tunai</span><span>'+rp(s.paid)+'</span></div><div><span>Kembali</span><span>'+rp(s.paid-s.total)+'</span></div><button data-a="view" data-i="'+s.id+'" style="margin-top:8px">Lihat struk</button></div>':'')+'</div>'}).join('')+'<div style="margin-top:16px"><button class="danger" data-a="clear">'+(confirmId==='all'?'Yakin hapus semua riwayat?':'Hapus semua riwayat')+'</button></div>':'<div class="empty">Belum ada transaksi.</div>');
  }
  bar();
}
function grid(){
  const g=$('#grid');if(!g)return;
  const l=db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  g.innerHTML=l.length?l.map(p=>'<div class="tile'+(cart[p.id]?' on':'')+'"><button class="add" data-a="add" data-i="'+p.id+'"><b>'+esc(p.name)+'</b><span>'+rp(p.price)+'</span></button>'+(cart[p.id]?'<div class="st"><button data-a="tdec" data-i="'+p.id+'" aria-label="Kurangi">−</button><b>'+cart[p.id]+'</b><button data-a="add" data-i="'+p.id+'" aria-label="Tambah">+</button></div>':'')+'</div>').join(''):'<div class="empty" style="grid-column:1/-1">'+(db.products.length?'Produk tidak ditemukan.':'Tambahkan produk di tab Produk dulu.')+'</div>';
}
function bar(){
  const n=count();
  $('#bar').innerHTML=(tab==='kasir'&&n)?'<button class="pri" data-a="pay"><span>'+n+' item</span><em>'+rp(total())+'</em><span>Bayar</span></button>':'';
}
function sheet(){
  const o=$('#ov'),s=$('#sheet');
  o.classList.toggle('show',sheetOn);
  if(!sheetOn)return;
  if(receipt){
    const r=receipt;
    s.innerHTML='<h1>Struk</h1><div class="paper">'+rcpt(r)+'</div><button class="pri" style="width:100%;margin-bottom:10px" data-a="print">Cetak struk</button><button style="width:100%;margin-bottom:10px" data-a="share">Bagikan / salin teks struk</button><button style="width:100%" data-a="newtx">Selesai</button>';
    return;
  }
  const T=total(),L=lines();
  const opts=[...new Set([T,Math.ceil(T/10000)*10000,Math.ceil(T/50000)*50000,Math.ceil(T/100000)*100000])].filter(x=>x>=T).slice(0,4);
  s.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">Pesanan</h1><button data-a="close">Tutup</button></div>'+
  L.map(l=>'<div class="row"><div class="g"><b>'+esc(l.p.name)+'</b><br><small>'+rp(l.p.price)+'</small></div><div class="qty"><button data-a="dec" data-i="'+l.p.id+'">−</button><b>'+l.qty+'</b><button data-a="inc" data-i="'+l.p.id+'">+</button></div></div>').join('')+
  '<div class="total"><span>Total</span><span>'+rp(T)+'</span></div><label class="mute" for="paid">Uang diterima</label><input id="paid" inputmode="numeric" placeholder="0" value="'+(paid||'')+'" style="margin-top:6px"><div class="quick">'+opts.map(x=>'<button data-a="cash" data-i="'+x+'">'+(x===T?'Uang pas':rp(x))+'</button>').join('')+'</div><div class="chg"><span>Kembalian</span><span id="chg"></span></div><button id="done" class="pri" style="width:100%" data-a="done">Selesaikan pembayaran</button><button class="danger" style="width:100%;margin-top:10px" data-a="clearcart">Batalkan pesanan</button>';
  upd();
}
function upd(){
  const c=$('#chg'),d=$('#done');if(!c)return;
  const diff=paid-total();
  c.textContent=diff>=0?rp(diff):'Kurang '+rp(-diff);
  d.disabled=diff<0||!count();
}
function rcpt(r){
  const d=new Date(r.ts),c=t=>'<div style="text-align:center">'+t+'</div>',pl=(a,b,x)=>'<div class="pl"'+(x?' style="font-weight:800"':'')+'><span>'+a+'</span><span>'+b+'</span></div>';
  return '<div style="text-align:center;font-weight:800;font-size:1.15em">'+esc(db.shop||'Nama Toko')+'</div>'+(db.addr?c(esc(db.addr)):'')+(db.tel?c('Telp. '+esc(db.tel)):'')+'<hr>'+pl('No.','#'+String(r.id).padStart(4,'0'))+pl('Tanggal',d.toLocaleDateString('id-ID'))+pl('Jam',d.toLocaleTimeString('id-ID'))+'<hr>'+r.items.map(i=>'<div>'+esc(i.name)+'</div>'+pl(i.qty+' × '+rp(i.price),rp(i.qty*i.price))).join('')+'<hr>'+pl('Jumlah item',r.items.reduce((x,i)=>x+i.qty,0))+pl('Total',rp(r.total),1)+pl('Tunai',rp(r.paid))+pl('Kembali',rp(r.paid-r.total))+'<hr>'+c(esc(db.foot||'Terima kasih atas kunjungan Anda'));
}
function rtxt(r){
  const W=32,d=new Date(r.ts),ctr=t=>' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t,two=(a,b)=>a+' '.repeat(Math.max(1,W-a.length-b.length))+b,ln='-'.repeat(W);
  const o=[ctr(db.shop||'Nama Toko')];
  if(db.addr)o.push(ctr(db.addr));
  if(db.tel)o.push(ctr('Telp. '+db.tel));
  o.push(ln,two('No.','#'+String(r.id).padStart(4,'0')),two('Tanggal',d.toLocaleDateString('id-ID')),two('Jam',d.toLocaleTimeString('id-ID')),ln);
  r.items.forEach(i=>{o.push(i.name,two(i.qty+' x '+rp(i.price),rp(i.qty*i.price)))});
  o.push(ln,two('Total',rp(r.total)),two('Tunai',rp(r.paid)),two('Kembali',rp(r.paid-r.total)),ln,ctr(db.foot||'Terima kasih atas kunjungan Anda'));
  return o.join('\n');
}
const A={
  tab(i){tab=i;confirmId=null;editId=null;render()},
  add(i){cart[i]=(cart[i]||0)+1;grid();bar()},
  tdec(i){cart[i]--;if(cart[i]<=0)delete cart[i];grid();bar()},
  clearcart(){cart={};paid=0;sheetOn=false;sheet();render()},
  print(){
    const r=receipt;if(!r)return;
    $('#prt').innerHTML=rcpt(r);
    try{window.print()}catch(e){toast('Cetak tidak tersedia di sini')}
  },
  inc(i){cart[i]++;sheet();grid();bar()},
  dec(i){cart[i]--;if(cart[i]<=0)delete cart[i];if(!count()){sheetOn=false}sheet();render()},
  pay(){paid=0;receipt=null;sheetOn=true;sheet()},
  close(){sheetOn=false;sheet();render()},
  cash(i){paid=+i;$('#paid').value=paid;upd()},
  done(){
    const T=total();if(paid<T||!T)return;
    const s={id:db.seq++,ts:Date.now(),items:lines().map(l=>({name:l.p.name,price:l.p.price,qty:l.qty})),total:T,paid};
    db.sales.unshift(s);save();cart={};receipt=s;sheet();
  },
  newtx(){receipt=null;sheetOn=false;sheet();render()},
  saveprod(){
    const n=$('#pn').value.trim(),p=parseInt($('#pp').value.replace(/\D/g,''),10);
    if(!n||!(p>=0)){toast('Isi nama dan harga produk');return}
    if(editId){const e=prod(editId);e.name=n;e.price=p;editId=null}
    else db.products.push({id:db.seq++,name:n,price:p});
    save();render();toast('Produk disimpan');
  },
  cancel(){editId=null;render()},
  share(){
    const r=receipt;if(!r)return;const t=rtxt(r);
    if(navigator.share){navigator.share({text:t}).catch(()=>{});return}
    try{navigator.clipboard.writeText(t).then(()=>toast('Struk disalin'),()=>toast('Gagal menyalin'))}catch(e){toast('Gagal menyalin')}
  },
  view(i){receipt=db.sales.find(s=>s.id==i)||null;if(receipt){sheetOn=true;sheet()}},
  editprod(i){editId=+i;confirmId=null;render();window.scrollTo(0,0)},
  delprod(i){
    if(confirmId!==+i){confirmId=+i;render();return}
    db.products=db.products.filter(p=>p.id!==+i);delete cart[i];confirmId=null;save();render();
  },
  sale(i){openSale=openSale==i?null:+i;render()},
  clear(){
    if(confirmId!=='all'){confirmId='all';render();return}
    db.sales=[];confirmId=null;save();render();
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;grid()}
  if(['shop','addr','tel','foot'].includes(e.target.id)){db[e.target.id]=e.target.value;save()}
  if(e.target.id==='paid'){paid=parseInt(e.target.value.replace(/\D/g,''),10)||0;upd()}
});
render();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
